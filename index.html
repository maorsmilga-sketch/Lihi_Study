5B7\u05BC\u05E7\u05BB\u05BC\u05E4\u05B0\u05E1\u05B8\u05D4.","\u05DB\u05B0\u05BC\u05E9\u05B6\u05C1\u05D9\u05B8\u05BC\u05E2\u05B5\u05DC \u05D7\u05B8\u05D6\u05B0\u05E8\u05B8\u05D4 \u05DE\u05B4\u05DF \u05D4\u05B7\u05D1\u05B6\u05BC\u05E8\u05B6\u05D6, \u05D4\u05B4\u05D9\u05D0 \u05E8\u05B8\u05D0\u05B2\u05EA\u05B8\u05D4 \u05E4\u05B5\u05BC\u05E8\u05D5\u05BC\u05E8\u05B4\u05D9\u05DD \u05DC\u05B0\u05D9\u05B7\u05D3 \u05D0\u05B7\u05D7\u05B7\u05EA \u05D4\u05B7\u05E6\u05B7\u05BC\u05DC\u05B8\u05BC\u05D7\u05D5\u05B9\u05EA.","\u05E2\u05B7\u05DC \u05E2\u05B8\u05E0\u05B8\u05E3 \u05E0\u05B8\u05DE\u05D5\u05BC\u05DA\u05B0 \u05D9\u05B8\u05E9\u05B0\u05C1\u05D1\u05B8\u05D4 \u05E6\u05B4\u05E4\u05BC\u05D5\u05B9\u05E8, \u05D5\u05BC\u05D1\u05B7\u05DE\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05E8 \u05E9\u05B6\u05C1\u05DC\u05B8\u05BC\u05D4\u05BC \u05D4\u05B8\u05D9\u05B8\u05D4 \u05E4\u05B5\u05BC\u05E8\u05D5\u05BC\u05E8 \u05E7\u05B8\u05D8\u05B8\u05DF.","\u05D9\u05B8\u05E2\u05B5\u05DC \u05E8\u05B8\u05E6\u05B0\u05EA\u05B8\u05D4 \u05DC\u05B0\u05DB\u05B7\u05E1\u05BC\u05D5\u05B9\u05EA \u05D0\u05B6\u05EA \u05D4\u05B7\u05E6\u05B7\u05BC\u05DC\u05B8\u05BC\u05D7\u05D5\u05B9\u05EA, \u05D0\u05B7\u05DA\u05B0 \u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05D4\u05B4\u05E6\u05B4\u05BC\u05D9\u05E2\u05B8\u05D4 \u05DC\u05B0\u05D4\u05B7\u05E2\u05B2\u05D1\u05B4\u05D9\u05E8 \u05D0\u05D5\u05B9\u05EA\u05B8\u05DF \u05DC\u05B7\u05D7\u05B6\u05D3\u05B6\u05E8.",'\u05D4\u05B4\u05D9\u05D0 \u05D4\u05B4\u05E1\u05B0\u05D1\u05B4\u05BC\u05D9\u05E8\u05B8\u05D4: "\u05DB\u05B8\u05BC\u05DA\u05B0 \u05D9\u05B4\u05E9\u05B8\u05BC\u05C1\u05D0\u05B2\u05E8\u05D5\u05BC \u05D4\u05B8\u05E2\u05D5\u05BC\u05D2\u05B4\u05D9\u05BC\u05D5\u05B9\u05EA \u05DC\u05B8\u05D0\u05D5\u05B9\u05E8\u05B0\u05D7\u05D5\u05B9\u05EA, \u05D5\u05B0\u05D4\u05B7\u05E6\u05B4\u05BC\u05E4\u05BC\u05D5\u05B9\u05E8\u05B4\u05D9\u05DD \u05DC\u05B9\u05D0 \u05D9\u05B4\u05E1\u05B0\u05EA\u05B7\u05BC\u05D1\u05B0\u05BC\u05DB\u05D5\u05BC \u05D1\u05B7\u05BC\u05DE\u05B7\u05BC\u05E4\u05B4\u05BC\u05D9\u05BC EA \u05D7\u05B2\u05D3\u05B7\u05E8 \u05D4\u05B7\u05DE\u05B7\u05BC\u05E4\u05BC\u05D5\u05B9\u05EA \u05D5\u05B0\u05D9\u05B8\u05E6\u05B0\u05D0\u05B8\u05D4 \u05D0\u05B6\u05DC \u05D4\u05B7\u05DE\u05B4\u05BC\u05E1\u05B0\u05D3\u05B0\u05BC\u05E8\u05D5\u05B9\u05DF.","\u05DC\u05B4\u05E4\u05B0\u05E0\u05B5\u05D9 \u05E9\u05B6\u05C1\u05E1\u05B8\u05BC\u05D2\u05B0\u05E8\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05D3\u05B6\u05BC\u05DC\u05B6\u05EA, \u05DB\u05B4\u05BC\u05D1\u05B0\u05BC\u05EA\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05DE\u05B0\u05BC\u05E0\u05D5\u05B9\u05E8\u05B8\u05D4 \u05D4\u05B7\u05D2\u05B0\u05BC\u05D3\u05D5\u05B9\u05DC\u05B8\u05D4, \u05D0\u05B7\u05DA\u05B0 \u05E9\u05B8\u05C1\u05DB\u05B0\u05D7\u05B8\u05D4 \u05D0\u05B6\u05EA \u05E4\u05B8\u05BC\u05E0\u05B8\u05E1 \u05D4\u05B7\u05E7\u05B0\u05BC\u05E8\u05B4\u05D9\u05D0\u05B8\u05D4.","\u05DB\u05B7\u05BC\u05E2\u05B2\u05D1\u05B9\u05E8 \u05E8\u05B6\u05D2\u05B7\u05E2 \u05D4\u05B4\u05D1\u05B0\u05D7\u05B4\u05D9\u05E0\u05B8\u05D4 \u05D1\u05B0\u05BC\u05E4\u05B7\u05E1 \u05D0\u05D5\u05B9\u05E8 \u05D3\u05B7\u05BC\u05E7 \u05DE\u05B4\u05EA\u05B7\u05BC\u05D7\u05B7\u05EA \u05DC\u05B7\u05D3\u05B6\u05BC\u05DC\u05B6\u05EA.","\u05D4\u05B4\u05D9\u05D0 \u05DC\u05B9\u05D0 \u05E8\u05B8\u05D0\u05B2\u05EA\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E4\u05B8\u05BC\u05E0\u05B8\u05E1 \u05E2\u05B7\u05E6\u05B0\u05DE\u05D5\u05B9, \u05D5\u05BC\u05D1\u05B0\u05DB\u05B8\u05DC \u05D6\u05B9\u05D0\u05EA \u05E9\u05B4\u05C1\u05E2\u05B2\u05E8\u05B8\u05D4 \u05E9\u05B6\u05C1\u05DE\u05B7\u05BC\u05DB\u05B0\u05E9\u05B4\u05C1\u05D9\u05E8 \u05DB\u05B8\u05BC\u05DC\u05B0\u05E9\u05B6\u05C1\u05D4\u05D5\u05BC \u05E0\u05B4\u05E9\u05B0\u05C1\u05D0\u05B7\u05E8 \u05D3\u05BC\u05D5\u05B9\u05DC\u05B5\u05E7.","\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D7\u05B8\u05D6\u05B0\u05E8\u05B8\u05D4 \u05D5\u05BC\u05D1\u05B8\u05D3\u05B0\u05E7\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05D7\u05B6\u05D3\u05B6\u05E8, \u05D5\u05BC\u05DE\u05B8\u05E6\u05B0\u05D0\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E4\u05B8\u05BC\u05E0\u05B8\u05E1 \u05E2\u05B7\u05DC \u05D4\u05B7\u05E9\u05BB\u05BC\u05C1\u05DC\u05B0\u05D7\u05B8\u05DF.","\u05DC\u05B0\u05D9\u05B8\u05D3\u05D5\u05B9 \u05D4\u05B8\u05D9\u05B0\u05EA\u05B8\u05D4 \u05E7\u05BB\u05E4\u05B0\u05E1\u05B8\u05D4 \u05D5\u05BC\u05D1\u05B8\u05D4\u05BC 48 \u05E1\u05D5\u05B9\u05DC\u05B0\u05DC\u05D5\u05B9\u05EA, \u05D4\u05B7\u05DE\u05B0\u05BC\u05E1\u05BB\u05D3\u05B8\u05BC\u05E8\u05D5\u05B9\u05EA \u05E9\u05B8\u05C1\u05D5\u05B6\u05D4 \u05D1\u05B0\u05BC\u05E9\u05B8\u05C1\u05D5\u05B6\u05D4 \u05D1\u05B0\u05BC\u05E9\u05B4\u05C1\u05E9\u05B8\u05BC\u05C1\u05D4 \u05EA\u05B8\u05BC\u05D0\u05B4\u05D9\u05DD.","\u05D0\u05B7\u05D7\u05B2\u05E8\u05B5\u05D9 \u05E9\u05B6\u05C1\u05DB\u05B4\u05BC\u05D1\u05B0\u05BC\u05EA\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E4\u05B8\u05BC\u05E0\u05B8\u05E1, \u05E1\u05B8\u05D2\u05B0\u05E8\u05B8\u05D4 \u05E9\u05C1\u05D5\u05BC\u05D1 \u05D0\u05B6\u05EA \u05D4\u05B7\u05D3\u05B6\u05BC\u05DC\u05B6\u05EA \u05D5\u05B0\u05E8\u05B8\u05D0\u05B2\u05EA\u05B8\u05D4 \u05E9\u05B6\u05C1\u05D4\u05B8\u05D0\u05D5\u05B9\u05E8 \u05E0\u05B6\u05E2\u05B1\u05DC\u05B7\u05DD.",'\u05D4\u05B4\u05D9\u05D0 \u05D0\u05B8\u05DE\u05B0\u05E8\u05B8\u05D4 \u05DC\u05B0\u05E2\u05B7\u05E6\u05B0\u05DE\u05B8\u05D4\u05BC: "\u05D1\u05B7\u05BC\u05E4\u05B7\u05BC\u05E2\u05B7\u05DD \u05D4\u05B7\u05D1\u05B8\u05BC\u05D0\u05B8\u05D4 \u05D0\u05B6\u05D1\u05B0\u05D3\u05B9\u05BC\u05E7 \u05D2\u05B7\u05BC\u05DD \u05D0\u05B6\u05EA \u05D4\u05B7\u05DE\u05B0\u05BC\u05E0\u05D5\u05B9\u05E8\u05D5\u05B9\u05EA \u05D4\u05B7\u05E7\u05B0\u05BC\u05D8\u05B7\u05E0\u05BC\u05D5\u05B9\u05EA."'],word:"\u05E9\u05B4\u05C1\u05E2\u05B2\u05E8\u05B8\u05D4",meaning:"\u05D7\u05B8\u05E9\u05B0\u05C1\u05D1\u05B8\u05D4 \u05E2\u05B7\u05DC \u05D4\u05B6\u05E1\u05B0\u05D1\u05B5\u05BC\u05E8 \u05D0\u05B6\u05E4\u05B0\u05E9\u05B8\u05C1\u05E8\u05B4\u05D9",fact:"\u05E2\u05B7\u05DC \u05DE\u05B8\u05D4 \u05D4\u05B4\u05E1\u05B0\u05EA\u05B7\u05BC\u05DE\u05B0\u05BC\u05DB\u05B8\u05D4 \u05D4\u05B7\u05D4\u05B7\u05E9\u05B0\u05C1\u05E2\u05B8\u05E8\u05B8\u05D4 \u05E9\u05B6\u05C1\u05DC \u05DE\u05B4\u05D9\u05B8\u05BC\u05D4?",answer:"\u05E2\u05B7\u05DC \u05E4\u05B7\u05BC\u05E1 \u05D4\u05B8\u05D0\u05D5\u05B9\u05E8 \u05DE\u05B4\u05EA\u05B7\u05BC\u05D7\u05B7\u05EA \u05DC\u05B7\u05D3\u05B6\u05BC\u05DC\u05B6\u05EA",why:"\u05E4\u05B7\u05BC\u05E1 \u05D4\u05B8\u05D0\u05D5\u05B9\u05E8 \u05D4\u05B8\u05D9\u05B8\u05D4 \u05E1\u05B4\u05D9\u05DE\u05B8\u05DF \u05E2\u05B8\u05E7\u05B4\u05D9\u05E3 \u05DC\u05B0\u05DE\u05B7\u05DB\u05B0\u05E9\u05B4\u05C1\u05D9\u05E8 \u05E9\u05B6\u05C1\u05E0\u05B4\u05BC\u05E9\u05B0\u05C1\u05D0\u05B7\u05E8 \u05D3\u05BC\u05D5\u05B9\u05DC\u05B5\u05E7.",lesson:"\u05E1\u05B4\u05D9\u05DE\u05B8\u05DF \u05E7\u05B8\u05D8\u05B8\u05DF \u05D9\u05B8\u05DB\u05D5\u05B9\u05DC \u05DC\u05B0\u05D4\u05D5\u05B9\u05D1\u05B4\u05D9\u05DC \u05DC\u05B0\u05D4\u05B6\u05E1\u05B0\u05D1\u05B5\u05BC\u05E8, \u05D0\u05B2\u05D1\u05B8\u05DC \u05DB\u05B0\u05BC\u05D3\u05B7\u05D0\u05D9 \u05DC\u05B4\u05D1\u05B0\u05D3\u05B9\u05BC\u05E7 \u05D0\u05D5\u05B9\u05EA\u05D5\u05B9.",math:[[48,"/",6,"48 \u05E1\u05D5\u05B9\u05DC\u05B0\u05DC\u05D5\u05B9\u05EA \u05DE\u05B0\u05D7\u05BB\u05DC\u05B8\u05BC\u05E7\u05D5\u05B9\u05EA \u05E9\u05B8\u05C1\u05D5\u05B6\u05D4 \u05D1\u05B0\u05BC\u05E9\u05B8\u05C1\u05D5\u05B6\u05D4 \u05D1\u05B0\u05BC\u05E9\u05B4\u05C1\u05E9\u05B8\u05BC\u05C1\u05D4 \u05EA\u05B8\u05BC\u05D0\u05B4\u05D9\u05DD. \u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05D1\u05B0\u05BC\u05DB\u05B8\u05DC \u05EA\u05B8\u05BC\u05D0?","\u05E1\u05D5\u05B9\u05DC\u05B0\u05DC\u05D5\u05B9\u05EA"],[48,"-",12,"\u05D0\u05B4\u05DD \u05DE\u05D5\u05B9\u05E6\u05B4\u05D9\u05D0\u05B4\u05D9\u05DD 12 \u05E1\u05D5\u05B9\u05DC\u05B0\u05DC\u05D5\u05B9\u05EA \u05DE\u05B4\u05DF \u05D4\u05B7\u05E7\u05BB\u05BC\u05E4\u05B0\u05E1\u05B8\u05D4, \u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05E0\u05B4\u05E9\u05B0\u05C1\u05D0\u05B8\u05E8\u05D5\u05B9\u05EA?","\u05E1\u05D5\u05B9\u05DC\u05B0\u05DC\u05D5\u05B9\u05EA"]]},{id:"g3-s8",title:"\u05D4\u05B7\u05E1\u05B4\u05BC\u05D9\u05E8\u05D5\u05B9\u05EA \u05E9\u05B6\u05C1\u05DC \u05D2\u05B6\u05BC\u05E9\u05B6\u05C1\u05E8 \u05D4\u05B8\u05E2\u05B2\u05E0\u05B8\u05E0\u05B4\u05D9\u05DD",text:["\u05D9\u05B8\u05E2\u05B5\u05DC \u05E8\u05B8\u05E6\u05B0\u05EA\u05B8\u05D4 \u05DC\u05B4\u05D1\u05B0\u05D3\u05B9\u05BC\u05E7 \u05D0\u05B5\u05D9\u05D6\u05D5\u05B9 \u05E1\u05B4\u05D9\u05E8\u05B7\u05EA \u05E0\u05B0\u05D9\u05B8\u05E8 \u05EA\u05B8\u05BC\u05E9\u05C1\u05D5\u05BC\u05D8 \u05E8\u05B8\u05D7\u05D5\u05B9\u05E7 \u05D9\u05D5\u05B9\u05EA\u05B5\u05E8 \u05D1\u05B4\u05BC\u05EA\u05B0\u05E2\u05B8\u05DC\u05B7\u05EA \u05D4\u05B7\u05DE\u05B7\u05BC\u05D9\u05B4\u05DD.","\u05D4\u05B4\u05D9\u05D0 \u05E7\u05B4\u05E4\u05B0\u05BC\u05DC\u05B8\u05D4 5 \u05E1\u05B4\u05D9\u05E8\u05D5\u05B9\u05EA, \u05D5\u05B0\u05EA\u05B8\u05DE\u05B8\u05E8 \u05E7\u05B4\u05E4\u05B0\u05BC\u05DC\u05B8\u05D4 \u05E2\u05D5\u05B9\u05D3 7.",'\u05DC\u05B4\u05E4\u05B0\u05E0\u05B5\u05D9 \u05D4\u05B7\u05E0\u05B4\u05BC\u05E1\u05BC\u05D5\u05BC\u05D9 \u05DB\u05B8\u05BC\u05EA\u05B0\u05D1\u05D5\u05BC \u05E9\u05B0\u05C1\u05EA\u05B5\u05BC\u05D9\u05D4\u05B6\u05DF \u05DB\u05B0\u05BC\u05DC\u05B8\u05DC: "\u05D1\u05B0\u05BC\u05DB\u05B8\u05DC \u05E4\u05B7\u05BC\u05E2\u05B7\u05DD \u05DE\u05B0\u05E9\u05B7\u05C1\u05D7\u05B0\u05E8\u05B0\u05E8\u05D5\u05B9\u05EA \u05E1\u05B4\u05D9\u05E8\u05B8\u05D4 \u05DE\u05B5\u05D0\u05D5\u05B9\u05EA\u05B8\u05D4\u05BC \u05E0\u05B0\u05E7\u05BB\u05D3\u05B8\u05BC\u05D4."',"\u05E1\u05B4\u05D9\u05E8\u05B8\u05D4 \u05D0\u05B7\u05D7\u05B7\u05EA \u05E0\u05B6\u05E2\u05B6\u05E6\u05B0\u05E8\u05B8\u05D4 \u05DC\u05B0\u05D9\u05B7\u05D3 \u05D0\u05B6\u05D1\u05B6\u05DF, \u05D0\u05B7\u05DA\u05B0 \u05D9\u05B8\u05E2\u05B5\u05DC \u05DC\u05B9\u05D0 \u05D4\u05B4\u05DB\u05B0\u05E8\u05B4\u05D9\u05D6\u05B8\u05D4 \u05DE\u05B4\u05D9\u05B8\u05BC\u05D3 \u05E9\u05B6\u05C1\u05D4\u05B4\u05D9\u05D0 \u05D2\u05B0\u05BC\u05E8\u05D5\u05BC\u05E2\u05B8\u05D4 \u05DE\u05B4\u05DF \u05D4\u05B8\u05D0\u05B2\u05D7\u05B5\u05E8\u05D5\u05B9\u05EA.","\u05D4\u05B4\u0 \u05B6\u05DC \u05DC\u05B4\u05E9\u05B0\u05C1\u05DC\u05D5\u05B9\u05E9\u05B8\u05C1\u05D4 \u05E7\u05B0\u05D8\u05B8\u05E2\u05B4\u05D9\u05DD \u05E9\u05B8\u05C1\u05D5\u05B4\u05D9\u05DD, \u05DE\u05B8\u05D4 \u05D4\u05B8\u05D9\u05B8\u05D4 \u05D0\u05B9\u05E8\u05B6\u05DA\u05B0 \u05DB\u05B8\u05BC\u05DC \u05E7\u05B6\u05D8\u05B7\u05E2?","\u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD"]]},{id:"g3-s10",title:"\u05D4\u05B7\u05E1\u05B6\u05BC\u05E8\u05B6\u05D8 \u05D4\u05B7\u05DB\u05B8\u05BC\u05D7\u05B9\u05DC \u05E9\u05B6\u05C1\u05DC \u05D4\u05B7\u05E6\u05B7\u05BC\u05D9\u05B6\u05BC\u05E8\u05B6\u05EA",text:["\u05D1\u05B7\u05BC\u05D3\u05B6\u05BC\u05E8\u05B6\u05DA\u05B0 \u05DC\u05B7\u05DE\u05B4\u05BC\u05D2\u05B0\u05D3\u05B8\u05BC\u05DC \u05DE\u05B8\u05E6\u05B0\u05D0\u05B8\u05D4 \u05EA\u05B8\u05BC\u05DE\u05B8\u05E8 \u05E1\u05B6\u05E8\u05B6\u05D8 \u05DB\u05B8\u05BC\u05D7\u05B9\u05DC \u05DC\u05B0\u05D9\u05B7\u05D3 \u05E9\u05B7\u05C1\u05E2\u05B7\u05E8 \u05D4\u05B7\u05D2\u05B7\u05BC\u05DF.","\u05D1\u05B4\u05BC\u05E7\u05B0\u05E6\u05B5\u05D4 \u05D4\u05B7\u05E1\u05B6\u05BC\u05E8\u05B6\u05D8 \u05D4\u05B8\u05D9\u05B8\u05D4 \u05DB\u05B6\u05BC\u05EA\u05B6\u05DD \u05E6\u05B6\u05D1\u05B7\u05E2 \u05D8\u05B8\u05E8\u05B4\u05D9, \u05D5\u05B0\u05DC\u05B8\u05DB\u05B5\u05DF \u05D4\u05B4\u05D9\u05D0 \u05E0\u05B4\u05D6\u05B0\u05D4\u05B2\u05E8\u05B8\u05D4 \u05E9\u05B6\u05C1\u05DC\u05B9\u05BC\u05D0 \u05DC\u05B0\u05DC\u05B7\u05DB\u05B0\u05DC\u05B5\u05DA\u05B0 \u05D0\u05B6\u05EA \u05D4\u05B7\u05DE\u05B7\u05BC\u05E4\u05B8\u05BC\u05D4.","\u05DC\u05B0\u05D9\u05B7\u05D3 \u05D4\u05B7\u05E1\u05B7\u05BC\u05E4\u05B0\u05E1\u05B8\u05DC \u05E8\u05B8\u05D0\u05B2\u05EA\u05B8\u05D4 \u05E9\u05B8\u05C1\u05DC\u05D5\u05B9\u05E9\u05C1 \u05D7\u05B2\u05D1\u05B5\u05E8\u05D5\u05B9\u05EA \u05E9\u05B6\u05C1\u05D4\u05B5\u05DB\u05B4\u05D9\u05E0\u05D5\u05BC \u05E9\u05B6\u05C1\u05DC\u05B6\u05D8 \u05DC\u05B0\u05DE\u05B4\u05E4\u05B0\u05D2\u05B7\u05BC\u05E9\u05C1 \u05E7\u05D5\u05B9\u05E8\u05B0\u05D0\u05D5\u05B9\u05EA.","\u05DC\u05B0\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D4\u05B8\u05D9\u05B8\u05D4 \u05DE\u05B4\u05DB\u05B0\u05D7\u05D5\u05B9\u05DC \u05DB\u05B8\u05BC\u05D7\u05B9\u05DC, \u05DC\u05B0\u05D9\u05B8\u05E2\u05B5\u05DC \u05DE\u05B4\u05DB\u05B0\u05D7\u05D5\u05B9\u05DC \u05D9\u05B8\u05E8\u05B9\u05E7 \u05D5\u05BC\u05DC\u05B0\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05DE\u05B4\u05DB\u05B0\u05D7\u05D5\u05B9\u05DC \u05E6\u05B8\u05D4\u05B9\u05D1.","\u05EA\u05B8\u05BC\u05DE\u05B8\u05E8 \u05DC\u05B9\u05D0 \u05D4\u05B4\u05DB\u05B0\u05E8\u05B4\u05D9\u05D6\u05B8\u05D4 \u05DE\u05B4\u05D9\u05B8\u05BC\u05D3 \u05DC\u05B0\u05DE\u05B4\u05D9 \u05E9\u05B7\u05C1\u05D9\u05B8\u05BC\u05DA\u05B0 \u05D4\u05B7\u05E1\u05B6\u05BC\u05E8\u05B6\u05D8, \u05D0\u05B6\u05DC\u05B8\u05BC\u05D0 \u05E9\u05B8\u05C1\u05D0\u05B2\u05DC\u05B8\u05D4 \u05DE\u05B4\u05D9 \u05D0\u05B4\u05D1\u05B0\u05BC\u05D3\u05B8\u05D4 \u05D0\u05D5\u05B9\u05EA\u05D5\u05B9.",'\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D7\u05B4\u05E4\u05B0\u05BC\u05E9\u05B8\u05C2\u05D4 \u05D1\u05B7\u05BC\u05DB\u05B4\u05BC\u05D9\u05E1 \u05D5\u05B0\u05D0\u05B8\u05DE\u05B0\u05E8\u05B8\u05D4: "\u05D6\u05B6\u05D4 \u05D4\u05B7\u05E1\u05B6\u05BC\u05E8\u05B6\u05D8 \u05E9\u05B6\u05C1\u05E7\u05B8\u05BC\u05E9\u05B7\u05C1\u05E8\u05B0\u05EA\u05B4\u05BC\u05D9 \u05DC\u05B7\u05DE\u05B7\u05BC\u05D7\u05B0\u05D1\u05B6\u05BC\u05E8\u05B6\u05EA \u05E9\u05B6\u05C1\u05DC\u05B4\u05BC\u05D9!"',"\u05E2\u05B7\u05DC \u05D4\u05B7\u05E9\u05B6\u05BC\u05C1\u05DC\u05B6\u05D8 \u05D4\u05B8\u05D9\u05D5\u05BC 4 \u05E9\u05C1\u05D5\u05BC\u05E8\u05D5\u05B9\u05EA, \u05D5\u05BC\u05D1\u05B0\u05DB\u05B8\u05DC \u05E9\u05C1\u05D5\u05BC\u05E8\u05B8\u05D4 8 \u05DB\u05BC\u05D5\u05B9\u05DB\u05B8\u05D1\u05B4\u05D9\u05DD \u05DE\u05B0\u05E6\u05BB\u05D9\u05B8\u05BC\u05E8\u05B4\u05D9\u05DD.","\u05D0\u05B7\u05D7\u05B2\u05E8\u05B5\u05D9 \u05E9\u05B6\u05C1\u05D4\u05B6\u05D7\u05B1\u05D6\u05B4\u05D9\u05E8\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E1\u05B6\u05BC\u05E8\u05B6\u05D8, \u05EA\u05B8\u05BC\u05DE\u05B8\u05E8 \u05E2\u05B8\u05D6\u05B0\u 5D0\u05B2\u05D1\u05B8\u05DC \u05E2\u05B2\u05D3\u05B7\u05D9\u05B4\u05DF \u05DB\u05B0\u05BC\u05D3\u05B7\u05D0\u05D9 \u05DC\u05B0\u05D1\u05B7\u05E7\u05B5\u05BC\u05E9\u05C1 \u05D0\u05B4\u05E9\u05BC\u05C1\u05D5\u05BC\u05E8.",math:[[4,"*",8,"\u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05DB\u05BC\u05D5\u05B9\u05DB\u05B8\u05D1\u05B4\u05D9\u05DD \u05D9\u05B4\u05D4\u05B0\u05D9\u05D5\u05BC \u05D1\u05B7\u05BC\u05E9\u05B6\u05BC\u05C1\u05DC\u05B6\u05D8 \u05D4\u05B7\u05DE\u05B8\u05BC\u05DC\u05B5\u05D0?","\u05DB\u05BC\u05D5\u05B9\u05DB\u05B8\u05D1\u05B4\u05D9\u05DD"],[32,"-",24,"\u05E6\u05B8\u05E8\u05B4\u05D9\u05DA\u05B0 32 \u05DB\u05BC\u05D5\u05B9\u05DB\u05B8\u05D1\u05B4\u05D9\u05DD, \u05D5\u05BC\u05DB\u05B0\u05D1\u05B8\u05E8 \u05E6\u05BB\u05D9\u05B0\u05BC\u05E8\u05D5\u05BC 24. \u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05E2\u05D5\u05B9\u05D3 \u05E6\u05B8\u05E8\u05B4\u05D9\u05DA\u05B0 \u05DC\u05B0\u05E6\u05B7\u05D9\u05B5\u05BC\u05E8?","\u05DB\u05BC\u05D5\u05B9\u05DB\u05B8\u05D1\u05B4\u05D9\u05DD"]]},{id:"g3-s11",title:"\u05D4\u05B7\u05E4\u05B7\u05BC\u05E2\u05B2\u05DE\u05D5\u05B9\u05DF \u05E9\u05B6\u05C1\u05D7\u05B4\u05DB\u05B8\u05BC\u05D4 \u05DC\u05B0\u05EA\u05B4\u05E7\u05BC\u05D5\u05BC\u05DF",text:["\u05D1\u05B0\u05BC\u05DB\u05B8\u05DC \u05E6\u05B8\u05D4\u05B3\u05E8\u05B7\u05D9\u05B4\u05DD \u05E6\u05B4\u05DC\u05B0\u05E6\u05B5\u05DC \u05E4\u05B7\u05BC\u05E2\u05B2\u05DE\u05D5\u05B9\u05DF \u05D4\u05B7\u05DE\u05B4\u05BC\u05D2\u05B0\u05D3\u05B8\u05BC\u05DC \u05D5\u05B0\u05D4\u05B4\u05D6\u05B0\u05DE\u05B4\u05D9\u05DF \u05D0\u05B6\u05EA \u05D4\u05B7\u05E7\u05BC\u05D5\u05B9\u05E8\u05B0\u05D0\u05D5\u05B9\u05EA \u05DC\u05B7\u05DE\u05B4\u05BC\u05E4\u05B0\u05D2\u05B8\u05BC\u05E9\u05C1.","\u05D9\u05D5\u05B9\u05DD \u05D0\u05B6\u05D7\u05B8\u05D3 \u05D7\u05B8\u05DC\u05B0\u05E4\u05B8\u05D4 \u05D4\u05B7\u05E9\u05B8\u05BC\u05C1\u05E2\u05B8\u05D4 \u05D4\u05B7\u05E7\u05B0\u05BC\u05D1\u05D5\u05BC\u05E2\u05B8\u05D4, \u05D0\u05B7\u05DA\u05B0 \u05DE\u05B4\u05DF \u05D4\u05B7\u05DE\u05B4\u05BC\u05D2\u05B0\u05D3\u05B8\u05BC\u05DC \u05DC\u05B9\u05D0 \u05E0\u05B4\u05E9\u05B0\u05C1\u05DE\u05B7\u05E2 \u05E6\u05B0\u05DC\u05B4\u05D9\u05DC.","\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05D5\u05B0\u05EA\u05B8\u05DE\u05B8\u05E8 \u05E2\u05B8\u05DC\u05D5\u05BC \u05DC\u05B4\u05D1\u05B0\u05D3\u05B9\u05BC\u05E7 \u05D5\u05BC\u05DE\u05B8\u05E6\u05B0\u05D0\u05D5\u05BC \u05E9\u05B6\u05C1\u05D4\u05B7\u05D7\u05B6\u05D1\u05B6\u05DC \u05E0\u05B4\u05E7\u05B0\u05E8\u05B7\u05E2, \u05D5\u05B0\u05D0\u05B4\u05DC\u05BC\u05D5\u05BC \u05D4\u05B7\u05E4\u05B7\u05BC\u05E2\u05B2\u05DE\u05D5\u05B9\u05DF \u05E2\u05B7\u05E6\u05B0\u05DE\u05D5\u05B9 \u05E0\u05D5\u05B9\u05EA\u05B7\u05E8 \u05E9\u05B8\u05C1\u05DC\u05B5\u05DD.","\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05D4\u05B4\u05E6\u05B4\u05BC\u05D9\u05E2\u05B8\u05D4 \u05DC\u05B0\u05D4\u05B8\u05D1\u05B4\u05D9\u05D0 \u05E4\u05B7\u05BC\u05E2\u05B2\u05DE\u05D5\u05B9\u05DF \u05D7\u05B8\u05D3\u05B8\u05E9\u05C1, \u05D0\u05B7\u05DA\u05B0 \u05EA\u05B8\u05BC\u05DE\u05B8\u05E8 \u05D1\u05B4\u05BC\u05E7\u05B0\u05BC\u05E9\u05B8\u05C1\u05D4 \u05DC\u05B4\u05D1\u05B0\u05D3\u05B9\u05BC\u05E7 \u05EA\u05B0\u05BC\u05D7\u05B4\u05DC\u05B8\u05BC\u05D4 \u05D0\u05B4\u05DD \u05D0\u05B6\u05E4\u05B0\u05E9\u05B8\u05C1\u05E8 \u05DC\u05B0\u05EA\u05B7\u05E7\u05B5\u05BC\u05DF \u05D0\u05B6\u05EA \u05D4\u05B7\u05D7\u05B6\u05D1\u05B6\u05DC.","\u05D1\u05B7\u05BC\u05DE\u05B7\u05BC\u05D7\u05B0\u05E1\u05B8\u05DF \u05DE\u05B8\u05E6\u05B0\u05D0\u05D5\u05BC \u05D2\u05B0\u05BC\u05DC\u05B4\u05D9\u05DC \u05D7\u05B6\u05D1\u05B6\u05DC \u05D1\u05B0\u05BC\u05D0\u05B9\u05E8\u05B6\u05DA\u05B0 30 \u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD \u05D5\u05B0\u05D4\u05B4\u05E9\u05B0\u05C1\u05EA\u05B7\u05BC\u05DE\u05B0\u05BC\u05E9\u05C1\u05D5\u05BC \u05D1\u05B0\u05BC\u05E9\u05B4\u05C1\u05E9\u05B8\u05BC\u05C1\u05D4 \u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD \u05DC\u05B7\u05EA\u05B4\u05BC\u05E7\u05BC\u05D5\u05BC\u05DF.","\u05D4\u05B5\u05DF \u05D1\u05B4\u05BC\u05E7\u05B0\u05BC\u05E9\u05C1\u05D5\u05BC \u05DE\u05B4\u05DF \u05D4\u05B7\u05E9\u05BC\u05C1\u05D5\u05B9\u05DE\u05B6\u05E8\u05B6\u05EA \u05D4\u05B7\u05DE\u05B0\u05BC\u05D1\u05BB\u05D2\u05B6\u05BC\u05E8\u05B6\u05EA \u05DC\u05B0\u05D7\u05B7\u05D1\u05B5\u05BC\u05E8 \u05D0\u05B6\u05EA \u05D4\u05B7\u05D7\u05B6\u05D1\u05B6\u05DC \u05D1\u05B7\u05BC\u05DE\u05B8\u05BC\u05E7\u05D5\u05B9\u05DD \u05D4\u05B7\u05D2\u05B8\u05BC\u05D1\u05D5\u05B9\u05D4\u05B7\u05BC, \u05D5\u05B0\u05DC\u05B9\u05D0 \u05D8\u05B4\u05E4\u05B0\u05BC\u05E1\u05D5\u05BC \u05DC\u05B0\u05E9\u05B8\u05C1\u05DD \u05D1\u05B0\u05BC\u05E2\u05B7\u05E6\u05B0\u05DE\u05B8\u05DF.","\u05DB\u05B0\u05BC\u05E9\u05B6\u05C1\u05DE\u05B8\u05BC\u05E9\u05B0\u05C1\u05DB\u05D5\u05BC \u05D1\u05B7\u05BC\u05E7\u05B8\u05BC\u05E6\u05B6\u05D4 \u05D4\u05B6\u05D7\u05B8\u05D3\u05B8\u05E9\u05C1, \u05E0\u05B4\u05E9\u05B0\u05C1\u05DE\u05B7\u05E2 \u05E9\u05C1\u05D5\u05BC\u05D1 \u05D4\u05B7\u05E6\u05B4\u05BC\u05DC\u05B0\u05E6\u05D5\u05BC\u05DC \u05D1\u05B0\u05BC\u05E8\u05B7\u05D7\u05B2\u05D1\u05B5\u05D9 \u05D4\u05B7\u05D2\u05B7\u05BC\u05DF.",'\u05D4\u05B7\u05E7\u05BC\u05D5\u05B9\u05E8\u05B0\u05D0\u05D5\u05B9\u05EA \u05D4\u05B4\u05D2\u05B4\u05BC\u05D9\u05E2\u05D5\u05BC \u05D1\u05B0\u05BC\u05D0\u05B4\u05D7\u05D5\u05BC\u05E8 \u05E7\u05B7\u05DC \u05D5\u05B0\u05D0\u05B8\u05DE\u05B0\u05E8\u05D5\u05BC: "\u05D8\u05D5\u05B9\u05D1 \u05E9\u05B6\u05C1\u05D1\u05B0\u05BC\u05D3\u05B7\u05E7\u05B0\u05EA\u05B6\u05BC\u05DF \u05DE\u05B8\u05D4 \u05D1\u05B6\u05BC\u05D0\u05B1\u05DE\u05B6\u05EA \u05E6\u05B8\u05E8\u05B4\u05D9\u05DA\u05B0 \u05DC\u05B0\u05EA\u05B7\u05E7\u05B5\u05BC\u05DF!"'],word:"\u05E0\u05D5\u05B9\u05EA\u05B7\u05E8 \u05E9\u05B8\u05C1\u05DC\u05B5\u05DD",meaning:"\u05E0\u05B4\u05E9\u05B0\u05C1\u05D0\u05B7\u05E8 \u05DC\u05B0\u05DC\u05B9\u05D0 \u05E0\u05B6\u05D6\u05B6\u05E7",fact:"\u05DC\u05B8\u05DE\u05B8\u05BC\u05D4 \u05D1\u05B4\u05BC\u05E7\u05B0\u05BC\u05E9\u05C1\u05D5\u05BC \u05D4\u05B7\u05D1\u05B8\u05BC\u05E0\u05D5\u05B9\u05EA \u05E2\u05B6\u05D6\u05B0\u05E8\u05B8\u05D4 \u05DE\u05B4\u05DF \u05D4\u05B7\u05E9\u05BC\u05C1\u05D5\u05B9\u05DE\u05B6\u05E8\u05B6\u05EA?",answer:"\u05D4\u05B7\u05D7\u05B4\u05D1\u05BC\u05D5\u05BC\u05E8 \u05D4\u05B8\u05D9\u05B8\u05D4 \u05D1\u05B0\u05BC\u05DE\u05B8\u05E7\u05D5\u05B9\u05DD \u05D2\u05B8\u05BC\u05D1\u05D5\u05B9\u05D4\u05B7\u05BC",why:"\u05D4\u05B5\u05DF \u05DC\u05B9\u05D0 \u05D8\u05B4\u05E4\u05B0\u05BC\u05E1\u05D5\u05BC \u05DC\u05B0\u05D1\u05B7\u05D3 \u05DC\u05B7\u05DE\u05B8\u05BC\u05E7\u05D5\u05B9\u05DD \u05D4\u05B7\u05D2\u05B8\u05BC\u05D1\u05D5\u05B9\u05D4\u05B7\u05BC \u05D5\u05BC\u05D1\u05B4\u05E7\u05B0\u05BC\u05E9\u05C1\u05D5\u05BC \u05E2\u05B6\u05D6\u05B0\u05E8\u05B8\u05D4 \u05DE\u05B7\u05EA\u05B0\u05D0\u05B4\u05D9\u05DE\u05B8\u05D4.",lesson:"\u05DC\u05B4\u05E4\u05B0\u05E2\u05B8\u05DE\u05B4\u05D9\u05DD \u05D3\u05B7\u05BC\u05D9 \u05DC\u05B0\u05EA\u05B7\u05E7\u05B5\u05BC\u05DF \u05D7\u05B5\u05DC\u05B6\u05E7 \u05E7\u05B8\u05D8\u05B8\u05DF \u05D1\u05B4\u05BC\u05DE\u05B0\u05E7\u05D5\u05B9\u05DD \u05DC\u05B0\u05D4\u05B7\u05D7\u05B0\u05DC\u05B4\u05D9\u05E3 \u05D7\u05B5\u05E4\u05B6\u05E5 \u05E9\u05B8\u05C1\u05DC\u05B5\u05DD.",math:[[30,"-",6,"\u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD \u05E9\u05B6\u05C1\u05DC \u05D7\u05B6\u05D1\u05B6\u05DC \u05E0\u05B4\u05E9\u05B0\u05C1\u05D0\u05B2\u05E8\u05D5\u05BC \u05D1\u05B7\u05BC\u05D2\u05B0\u05BC\u05DC\u05B4\u05D9\u05DC?","\u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD"],[24,"/",6,"\u05DE\u05B0\u05D7\u05B7\u05DC\u05B0\u05BC\u05E7\u05B4\u05D9\u05DD \u05D0\u05B6\u05EA 24 \u05D4\u05B7\u05DE\u05B6\u05BC\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD \u05E9\u05B6\u05C1\u05E0\u05B4\u05BC\u05E9\u05B0\u05C1\u05D0\u05B2\u05E8\u05D5\u05BC \u05DC\u05B4\u05E7\u05B0\u05D8\u05B8\u05E2\u05B4\u05D9\u05DD \u05D1\u05B0\u05BC\u05D0\u05B9\u05E8\u05B6\u05DA\u05B0 6 \u05DE\u05B6\u05D8\u05B0\u05E8\u05B4\u05D9\u05DD. \u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05E7\u05B0\u05D8\u05B8\u05E2\u05B4\u05D9\u05DD \u05D9\u05B4\u05D4\u05B0\u05D9\u05D5\u05BC?","\u05E7\u05B0\u05D8\u05B8\u05E2\u05B4\u05D9\u05DD"]]},{id:"g3-s12",title:"\u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8 \u05E9\u05B6\u05C1\u05DE\u05B5\u05BC\u05E2\u05B5\u05D1\u05B6\u05E8 \u05DC\u05B7\u05E7\u05B4\u05BC\u05D9\u05E8",text:["\u05D9\u05B8\u05E2\u05B5\u05DC \u05E1\u05B4\u05D3\u05B0\u05BC\u05E8\u05B8\u05D4 \u05E1\u05B0\u05E4\u05B8\u05E8\u05B4\u05D9\u05DD \u05D5\u05B0\u05E9\u05B8\u05C1\u05DE\u05B0\u05E2\u05B8\u05D4 \u05DE\u05B7\u05E0\u05B0\u05D2\u05B4\u05BC\u05D9\u05E0\u05B8\u05D4 \u05DE\u05BB\u05DB\u05B6\u05BC\u05E8\u05B6\u05EA \u05DE\u05B5\u05E2\u05B5\u05D1\u05B6\u05E8 \u05DC\u05B0\u05E7\u05B4\u05D9\u05E8 \u05D4\u05B7\u05E1\u05B4\u05BC\u05E4\u05B0\u05E8\u05B4\u05D9\u05B8\u05BC\u05D4.","\u05D4\u05B7\u05E7\u05BC\u05D5\u05B9\u05DC \u05D4\u05B8\u05D9\u05B8\u05D4 \u05E9\u05B8\u05C1\u05E7\u05B5\u05D8, \u05D5\u05B0\u05DC\u05B8\u05DB\u05B5\u05DF \u05D4\u05B4\u05D9\u05D0 \u05DC\u05B9\u05D0 \u05D4\u05B4\u05E6\u05B0\u05DC\u05B4\u05D9\u05D7\u05B8\u05D4 \u05DC\u05B0\u05D6\u05B7\u05D4\u05D5\u05B9\u05EA \u05DE\u05B4\u05D9 \u05E9\u05B8\u05C1\u05E8\u05B8\u05D4.",'\u05D4\u05B4\u05D9\u05D0 \u05E8\u05B8\u05E6\u05B0\u05EA\u05B8\u05D4 \u05DC\u05B4\u05E4\u05B0\u05EA\u05B9\u05BC\u05D7\u05B7 \u05D0\u05B6\u05EA \u05D4\u05B7\u05D3\u05B6\u05BC\u05DC\u05B6\u05EA, \u05D0\u05B2\u05D1\u05B8\u05DC \u05E8\u05B8\u05D0\u05B2\u05EA\u05B8\u05D4 \u05E9\u05B6\u05C1\u05DC\u05B6\u05D8 \u05E7\u05B8\u05D8\u05B8\u05DF: "\u05D7\u05B2\u05D6\u05B8\u05E8\u05B8\u05D4 \u05DC\u05B4\u05E7\u05B0\u05E8\u05B7\u05D0\u05EA \u05D4\u05B7\u05DE\u05BC\u05D5\u05B9\u05E4\u05B8\u05E2."',"\u05D9\u05B8\u05E2\u05B5\u05DC \u05D4\u05B4\u05DE\u05B0\u05EA\u05B4\u05BC\u05D9\u05E0\u05B8\u05D4 \u05E2\u05B7\u05D3 \u05E9\u05B6\u05C1\u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8 \u05D4\u05B4\u05E1\u05B0\u05EA\u05B7\u05BC\u05D9\u05B5\u05BC\u05DD, \u05D5\u05B0\u05E8\u05B7\u05E7 \u05D0\u05B8\u05D6 \u05D3\u05B8\u05BC\u05E4\u05B0\u05E7\u05B8\u05D4 \u05D5\u05BC\u05D1\u05B4\u05E7\u05B0\u05BC\u05E9\u05B8\u05C1\u05D4 \u05DC\u05B0\u05D4\u05B4\u05DB\u05B8\u05BC\u05E0\u05B5\u05E1.","\u05D1\u05B7\u05BC\u05D7\u05B6\u05D3\u05B6\u05E8 \u05D4\u05B8\u05D9\u05D5\u05BC \u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05D5\u05BC\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4, \u05E9\u05B6\u05C1\u05D4\u05B5\u05DB\u05B4\u05D9\u05E0\u05D5\u05BC \u05DE\u05D5\u05B9\u05E4\u05B8\u05E2 \u05D1\u05B6\u05BC\u05DF 6 \u05E9\u05B4\u05C1\u05D9\u05E8\u05B4\u05D9\u05DD.","\u05DB\u05B8\u05BC\u05DC \u05E9\u05B4\u05C1\u05D9\u05E8 \u05E0\u05B4\u05DE\u05B0\u05E9\u05B7\u05C1\u05DA\u05B0 4 \u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA, \u05D5\u05B0\u05D4\u05B5\u05DF \u05EA\u05B4\u05BC\u05DB\u05B0\u05E0\u05B0\u05E0\u05D5\u05BC \u05D2\u05B7\u05BC\u05DD \u05D4\u05B7\u05E4\u05B0\u05E1\u05B8\u05E7\u05B8\u05D4 \u05D0\u05B7\u05D7\u05B7\u05EA \u05E9\u05B6\u05C1\u05DC 5 \u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA \u05D1\u05B8\u05BC\u05D0\u05B6\u05DE\u05B0\u05E6\u05B7\u05E2.","\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05E1\u05B4\u05E4\u05B0\u05BC\u05E8\u05B8\u05D4 \u05E9\u05B6\u05C1\u05D4\u05B4\u05D9\u05D0 \u05E0\u05B6\u05E2\u05B1\u05E6\u05B6\u05E8\u05B6\u05EA \u05D1\u05B0\u05BC\u05DB\u05B8\u05DC \u05E4\u05B7\u05BC\u05E2\u05B7\u05DD \u05E9\u05B6\u05C1\u05DE\u05B4\u05BC\u05DC\u05B8\u05BC\u05D4 \u05E0\u05B4\u05E9\u05B0\u05C1\u05DB\u05B7\u05BC\u05D7\u05B7\u05EA.","\u05D9\u05B8\u05E2\u05B5\u05DC \u05D4\u05B4\u05E6\u05B4\u05BC\u05D9\u05E2\u05B8\u05D4 \u05DC\u05B4\u05DB\u05B0\u05EA\u05B9\u05BC\u05D1 \u05DB\u05B7\u05BC\u05E8\u05B0\u05D8\u05B4\u05D9\u05E1\u05B5\u05D9 \u05E8\u05B6\u05DE\u05B6\u05D6 \u05E9\u05B6\u05C1\u05D9\u05B7\u05BC\u05E2\u05B7\u05D6\u05B0\u05E8\u05D5\u05BC \u05DC\u05B0\u05D4\u05B4\u05D6\u05B8\u05BC\u05DB\u05B5\u05E8 \u05D1\u05B0\u05BC\u05DC\u05B4\u05D9 \u05DC\u05B7\u05E2\u05B2\u05E6\u05B9\u05E8.","\u05E9\u05B0\u05C1\u05DC\u05B8\u05E9\u05B0\u05C1\u05EA\u05B8\u05BC\u05DF \u05E0\u05B4\u05E1\u05BC\u05D5\u05BC \u05D0\u05B6\u05EA \u05D4\u05B8\u05E8\u05B7\u05E2\u05B0\u05D9\u05D5\u05B9\u05DF, \u05D5\u05B0\u05D4\u05B7\u05D7\u05B2\u05D6\u05B8\u05E8\u05B8\u05D4 \u05D4\u05B7\u05D1\u05B8\u05BC\u05D0\u05B8\u05D4 \u05E2\u05B8\u05D1\u05B0\u05E8\u05B8\u05D4 \u05D1\u05B0\u05BC\u05E8\u05B6\u05E6\u05B6\u05E3."],word:"\u05D1\u05B0\u05BC\u05E8\u05B6\u05E6\u05B6\u05E3",meaning:"\u05D1\u05B0\u05BC\u05DC\u05B4\u05D9 \u05E2\u05B2\u05E6\u05B4\u05D9\u05E8\u05D5\u05B9\u05EA \u05D7\u05D5\u05B9\u05D6\u05B0\u05E8\u05D5\u05B9\u05EA",fact:"\u05DC\u05B8\u05DE\u05B8\u05BC\u05D4 \u05D7\u05B4\u05DB\u05B0\u05BC\u05EA\u05B8\u05D4 \u05D9\u05B8\u05E2\u05B5\u05DC \u05DC\u05B4\u05E4\u05B0\u05E0\u05B5\u05D9 \u05E9\u05B6\u05C1\u05D3\u05B8\u05BC\u05E4\u05B0\u05E7\u05B8\u05D4?",answer:"\u05DB\u05B0\u05BC\u05D3\u05B5\u05D9 \u05DC\u05B9\u05D0 \u05DC\u05B0\u05D4\u05B7\u05E4\u05B0\u05E8\u05B4\u05D9\u05E2\u05B7 \u05D1\u05B0\u05BC\u05D0\u05B6\u05DE\u05B0\u05E6\u05B7\u05E2 \u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8",why:"\u05D4\u05B4\u05D9\u05D0 \u05D4\u05B4\u05DE\u05B0\u05EA\u05B4\u05BC\u05D9\u05E0\u05B8\u05D4 \u05DC\u05B0\u05E1\u05B4\u05D9\u05BC\u05D5\u05BC\u05DD \u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8 \u05D5\u05B0\u05DC\u05B9\u05D0 \u05E4\u05B8\u05BC\u05EA\u05B0\u05D7\u05B8\u05D4 \u05D1\u05B0\u05BC\u05D0\u05B6\u05DE\u05B0\u05E6\u05B7\u05E2 \u05D4\u05B7\u05D7\u05B2\u05D6\u05B8\u05E8\u05B8\u05D4.",lesson:"\u05E8\u05B6\u05DE\u05B6\u05D6 \u05E7\u05B8\u05D8\u05B8\u05DF \u05D9\u05B8\u05DB\u05D5\u05B9\u05DC \u05DC\u05B7\u05E2\u05B2\u05D6\u05B9\u05E8 \u05DC\u05B0\u05D4\u05B4\u05D6\u05B8\u05BC\u05DB\u05B5\u05E8 \u05D5\u05BC\u05DC\u05B0\u05D4\u05B7\u05DE\u05B0\u05E9\u05B4\u05C1\u05D9\u05DA\u05B0 \u05D1\u05B4\u05BC\u05D6\u05B0\u05E8\u05B4\u05D9\u05DE\u05B8\u05D4.",math:[[6,"*",4,"\u05DB\u05B7\u05BC\u05DE\u05B8\u05BC\u05D4 \u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA \u05E0\u05B4\u05DE\u05B0\u05E9\u05B8\u05C1\u05DB\u05B4\u05D9\u05DD \u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8\u05B4\u05D9\u05DD \u05D1\u05B0\u05BC\u05DC\u05B4\u05D9 \u05D4\u05B7\u05D4\u05B7\u05E4\u05B0\u05E1\u05B8\u05E7\u05B8\u05D4?","\u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA"],[24,"+",5,"\u05D4\u05B7\u05E9\u05B4\u05BC\u05C1\u05D9\u05E8\u05B4\u05D9\u05DD \u05E0\u05B4\u05DE\u05B0\u05E9\u05B8\u05C1\u05DB\u05B4\u05D9\u05DD 24 \u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA \u05D5\u05B0\u05D4\u05B7\u05D4\u05B7\u05E4\u05B0\u05E1\u05B8\u05E7\u05B8\u05D4 5. \u05DE\u05B8\u05D4 \u05D0\u05B9\u05E8\u05B6\u05DA\u05B0 \u05D4\u05B7\u05DE\u05BC\u05D5\u05B9\u05E4\u05B8\u05E2 \u05D4\u05B7\u05DB\u05BC\u05D5\u05B9\u05DC\u05B5\u05DC?","\u05D3\u05B7\u05BC\u05E7\u05BC\u05D5\u05B9\u05EA"]]},{id:"g3-s13",title:"\u05D4\u05B7\u05E1\u05B7\u05BC\u05E4\u05B0\u05E1\u05B8\u05DC \u05E9\u05B6\u05C1\u05D1\u05B8\u05BC\u05D7\u05B2\u05E8\u05D5\u05BC \u05D9\u05B7\u05D7\u05B7\u05D3",text:["\u05D1\u05B0\u05BC\u05D2\u05B7\u05DF \u05D4\u05B7\u05E1\u05B4\u05BC\u05E4\u05BC\u05D5\u05BC\u05E8\u05B4\u05D9\u05DD \u05E8\u05B8\u05E6\u05D5\u05BC \u05DC\u05B0\u05D4\u05B7\u05E6\u05B4\u05BC\u05D9\u05D1 \u05E1\u05B7\u05E4\u05B0\u05E1\u05B8\u05DC \u05D7\u05B8\u05D3\u05B8\u05E9\u05C1 \u05DB\u05B0\u05BC\u05D3\u05B5\u05D9 \u05E9\u05B6\u05C1\u05D0\u05B6\u05E4\u05B0\u05E9\u05B8\u05C1\u05E8 \u05D9\u05B4\u05D4\u05B0\u05D9\u05B6\u05D4 \u05DC\u05B4\u05E7\u05B0\u05E8\u05B9\u05D0 \u05D1\u05B0\u05BC\u05E0\u05B7\u05D7\u05B7\u05EA.","\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D4\u05B4\u05E6\u05B4\u05BC\u05D9\u05E2\u05B8\u05D4 \u05DC\u05B0\u05D4\u05B7\u05E6\u05B4\u05BC\u05D9\u05D1\u05D5\u05B9 \u05DC\u05B0\u05D9\u05B7\u05D3 \u05D4\u05B7\u05E9\u05B7\u05BC\u05C1\u05E2\u05B7\u05E8, \u05D5\u05B0\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05D4\u05B6\u05E2\u05B1\u05D3\u05B4\u05D9\u05E4\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B8\u05E2\u05B5\u05E5 \u05D4\u05B7\u05E1\u05B8\u05BC\u05DE\u05D5\u05BC\u05DA\u05B0 \u05DC\u05B7\u05E0\u05B7\u05BC\u05D7\u05B7\u05DC.","\u05D1\u05B4\u05BC\u05DE\u05B0\u05E7\u05D5\u05B9\u05DD \u05DC\u05B0\u05D4\u05B7\u05D7\u05B0\u05DC\u05B4\u05D9\u05D8 \u05E8\u05B7\u05E7 \u05DC\u05B0\u05E4\u05B4\u05D9 \u05D4\u05B7\u05DE\u05B7\u05BC\u05E8\u05B0\u05D0\u05B6\u05D4, \u05D4\u05B7\u05D1\u05B8\u05BC\u05E0\u05D5\u05B9\u05EA \u05D1\u05B8\u05BC\u05D3\u05B0\u05E7\u05D5\u05BC \u05D4\u05B5\u05D9\u05DB\u05B8\u05DF \u05D9\u05B5\u05E9\u05C1 \u05E6\u05B5\u05DC \u05D1\u05B4\u05BC\u05E9\u05B0\u05C1\u05E2\u05B7\u05EA \u05D4\u05B7\u05DE\u05B4\u05BC\u05E4\u05B0\u05D2\u05B8\u05BC\u05E9\u05C1.","\u05DC\u05B0\u05D9\u05B7\u05D3 \u05D4\u05B7\u05E9\u05B7\u05BC\u05C1\u05E2\u05B7\u05E8 \u05D4\u05B8\u05D9\u05B0\u05EA\u05B8\u05D4 \u05E9\u05B6\u05C1\u05DE\u05B6\u05E9\u05C1 \u05D7\u05B2\u05D6\u05B8\u05E7\u05B8\u05D4, \u05D5\u05B0\u05D0\u05B4\u05DC\u05BC\u05D5\u05BC \u05D4\u05B8\u05E2\u05B5\u05E5 \u05D4\u05B5\u05D8\u05B4\u05D9\u05DC \u05E6\u05B5\u05DC \u05E8\u05B8\u05D7\u05B8\u05D1 \u05D2\u05B7\u05BC\u05DD \u05D0\u05B7\u05D7\u05B7\u05E8 \u05D4\u05B7\u05E6\u05B8\u05BC\u05D4\u05B3\u05E8\u05B7\u05D9\u05B4\u05DD.","\u05D4\u05B5\u05DF \u05D1\u05B8\u05BC\u05D7\u05B2\u05E8\u05D5\u05BC \u05D1\u05B7\u05BC\u05DE\u05B8\u05BC\u05E7\u05D5\u05B9\u05DD \u05D4\u05B7\u05DE\u05BC\u05D5\u05BC\u05E6\u05B8\u05DC, \u05D5\u05B0\u05D4\u05B7\u05E6\u05B7\u05BC\u05D1\u05B8\u05BC\u05E2\u05B4\u05D9\u05EA \u05E6\u05B8\u05D1\u05B0\u05E2\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E1\u05B7\u05BC\u05E4\u05B0\u05E1\u05B8\u05DC.",'\u05D1\u05B7\u05BC\u05E6\u05B7\u05BC\u05D3 \u05D4\u05BB\u05E0\u05B7\u05BC\u05D7 \u05E9\u05B6\u05C1\u05DC\u05B6\u05D8: "\u05D4\u05B7\u05E6\u05B6\u05BC\u05D1\u05B7\u05E2 \u05E2\u05B2\u05D3\u05B7\u05D9\u05B4\u05DF \u05E8\u05B8\u05D8\u05B9\u05D1. \u05D0\u05B8\u05E0\u05B8\u05BC\u05D0 \u05D4\u05B7\u05DE\u05B0\u05EA\u05B4\u05BC\u05D9\u05E0\u05D5\u05BC \u05E2\u05B7\u05D3 \u05DE\u05B8\u05D7\u05B8\u05E8."',"\u05D9\u05B8\u05E2\u05B5\u05DC \u05D4\u05B4\u05D2\u05B4\u05BC\u05D9\u05E2\u05B8\u05D4 \u05E2\u05B4\u05DD 50 \u05E9\u05B0\u05C1\u05E7\u05B8\u05DC\u05B4\u05D9\u05DD \u05DC\u05B4\u05E7\u05B0\u05E0\u05B4\u05D9\u05B7\u05BC\u05EA \u05DB\u05B8\u05BC\u05E8\u05B4\u05D9\u05BC\u05D5\u05B9\u05EA; \u05E9\u05B0\u05C1\u05EA\u05B5\u05BC\u05D9 \u05DB\u05B8\u05BC\u05E8\u05B4\u05D9\u05BC\u05D5\u05B9\u05EA \u05E2\u05B8\u05DC\u05D5\u05BC \u05D9\u05B7\u05D7\u05B7\u05D3 32 \u05E9\u05B0\u05C1\u05E7\u05B8\u05DC\u05B4\u05D9\u05DD.","\u05D4\u05B4\u05D9\u05D0 \u05D4\u05B4\u05E9\u05B0\u05C1\u05D0\u05B4\u05D9\u05E8\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05DB\u05B8\u05BC\u05E8\u05B4\u05D9\u05BC\u05D5\u05B9\u05EA \u05D1\u05B7\u05BC\u05D7\u05B6\u05D3\u05B6\u05E8 \u05D1\u05B4\u05BC\u05DE\u05B0\u05E7\u05D5\u05B9\u05DD \u05DC\u05B0\u05D4\u05B7\u05E0\u05B4\u05BC\u05D9\u05D7\u05B8\u05DF \u05E2\u05B7\u05DC \u05D4\u05B7\u05E6\u05B6\u05BC\u05D1\u05B7\u05E2 \u05D4\u05B8\u05E8\u05B8\u05D8\u05B9\u05D1.","\u05DC\u05B7\u05DE\u05B8\u05BC\u05D7\u05B3\u05E8\u05B8\u05EA \u05D9\u05B8\u05E9\u05B0\u05C1\u05D1\u05D5\u05BC \u05DB\u05BB\u05BC\u05DC\u05B8\u05BC\u05DF \u05E2\u05B7\u05DC \u05D4\u05B7\u05E1\u05B7\u05BC\u05E4\u05B0\u05E1\u05B8\u05DC \u05D4\u05B7\u05D9\u05B8\u05BC\u05D1\u05B5\u05E9\u05C1, \u05D5\u05B0\u05D2\u05B4\u05DC\u05BC\u05D5\u05BC \u05E9\u05B6\u05C1\u05D4\u05B7\u05D1\u05B0\u05BC\u05D7\u05B4\u05D9\u05E8\u05B8\u05D4 \u05D4\u05B8\u05D9\u05B0\u05EA\u05B8\u05D4 \u05E0\u05D5\u05B9\u05D7\u05B8\u05D4 \u05D5\u05BC\u05E0\u05B0\u05E2\u05B4\u05D9\u05DE\u05B8\u05D4."],word:"\u05D1\u05B0\u05BC\u05E0\u05B7\u05D7\u05B7\u05EA",meaning:"\u05D1\u05B0\u05BC\u05E8\u05B9\u05D2\u05B7\u05E2 \u05D5\u05BC\u05D1\u05B0\u05E0\u05D5\u05B9\u05D7\u05D5\u05BC\u05EA",fact:"\u05DC\u05B8\u05DE\u05B8\u05BC\u05D4 \u05D9\u05B8\u05E2\u05B5\u05DC \u05DC\u05B9\u05D0 \u05D4\u05B4\u05E0\u05B4\u05BC\u05D9\u05D7\u05B8\u05D4 \u05DE\u05B4\u05D9\u05B8\u05BC\u05D3 \u05D0\u05B6\u05EA \u05D4\u05B7\u05DB\u05B8\u05BC\u05E8\u05B4\u05D9\u05BC\u05D5\u05B9\u05EA \u05E2\u05B7\u05DC \u05D4\u05B7\u05E1\u05B7\u05BC\u05E4\u05B0\u05E1\u05B8\u05DC?",answer:"\u05DE\u05B4\u05E4\u05B0\u05BC\u05E0\u05B5\u05D9 \u05E9\u05B6\u05C1\u05D4\u05B7\u05E6\u05B6\u05BC\u05D1\u05B7\u05E2 \u05E2\u05B2\u05D3\u05B7\u05D9\u05B4\u05DF \u05D4\u05B8\u05D9\u05B8\u05D4 \u05E8\u05B8\u05D8\u05B9\u05D1",why:"\u05D4\u05B4\u05D9\u05D0 \u05E7\u05B8\u05E8\u05B0\u05D0\u05B8\u05D4 \u05D0\u05B6\u05EA \u05D4\u05B7\u05E9\u05B6\u05BC\ \u05D9\u05DD.","\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4, \u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D5\u05B0\u05D9\u05B8\u05E2\u05B5\u05DC \u05D4\u05B4\u05E0\u05B4\u05BC\u05D9\u05D7\u05D5\u05BC \u05D1\u05B8\u05BC\u05D4\u05B6\u05DD \u05D0\u05B6\u05EA \u05E9\u05B0\u05C1\u05DC\u05D5\u05B9\u05E9\u05B6\u05C1\u05EA \u05D4\u05B8\u05D0\u05D5\u05B9\u05E6\u05B8\u05E8\u05D5\u05B9\u05EA \u05E9\u05B6\u05C1\u05D0\u05B8\u05E1\u05B0\u05E4\u05D5\u05BC \u05DC\u05B0\u05D0\u05B9\u05E8\u05B6\u05DA\u05B0 \u05D4\u05B7\u05DE\u05B7\u05BC\u05E1\u05B8\u05BC\u05E2.",'\u05E2\u05B7\u05DC \u05D4\u05B7\u05D3\u05B7\u05BC\u05E3 \u05D4\u05B7\u05E1\u05B8\u05BC\u05D2\u05D5\u05BC\u05E8 \u05D4\u05D5\u05B9\u05E4\u05B4\u05D9\u05E2\u05B8\u05D4 \u05E9\u05B0\u05C1\u05D0\u05B5\u05DC\u05B8\u05D4: "\u05DE\u05B8\u05D4 \u05E2\u05D5\u05B9\u05D6\u05B5\u05E8 \u05DC\u05B0\u05D4\u05B8\u05D1\u05B4\u05D9\u05DF \u05D2\u05B7\u05BC\u05DD \u05DB\u05B0\u05BC\u05E9\u05B6\u05C1\u05DC\u05B9\u05BC\u05D0 \u05D9\u05D5\u05B9\u05D3\u05B0\u05E2\u05B4\u05D9\u05DD \u05DE\u05B4\u05D9\u05B8\u05BC\u05D3 \u05D0\u05B6\u05EA \u05D4\u05B7\u05EA\u05B0\u05BC\u05E9\u05C1\u05D5\u05BC\u05D1\u05B8\u05D4?"',"\u05E0\u05D5\u05B9\u05E2\u05B8\u05D4 \u05E0\u05B4\u05D6\u05B0\u05DB\u05B0\u05BC\u05E8\u05B8\u05D4 \u05D1\u05B7\u05BC\u05E4\u05B6\u05BC\u05EA\u05B6\u05E7 \u05E9\u05B6\u05C1\u05D1\u05B7\u05BC\u05D2\u05B7\u05BC\u05DF \u05D5\u05BC\u05D1\u05B7\u05E9\u05B6\u05BC\u05C1\u05DC\u05B6\u05D8 \u05E9\u05B6\u05C1\u05E2\u05B8\u05D6\u05B7\u05E8 \u05DC\u05B8\u05D4\u05B6\u05DF \u05DC\u05B0\u05D4\u05B7\u05DE\u05B0\u05EA\u05B4\u05BC\u05D9\u05DF \u05DC\u05B4\u05E4\u05B0\u05E0\u05B5\u05D9 \u05D7\u05B2\u05E6\u05B4\u05D9\u05B7\u05BC\u05EA \u05D4\u05B7\u05D2\u05B6\u05BC\u05E9\u05B6\u05C1\u05E8.","\u05DE\u05B4\u05D9\u05B8\u05BC\u05D4 \u05D7\u05B8\u05E9\u05B0\u05C1\u05D1\u05B8\u05D4 \u05E2\u05B7\u05DC \u05D4\u05B7\u05E0\u05B4\u05BC\u05E1\u05BC\u05D5\u05BC\u05D9 \u05D1\u05B7\u05BC\u05E1\u05B4\u05BC\u05D9\u05E8\u05D5\u05B9\u05EA \u05D5\u05B0\u05E2\u05B7\u05DC \u05D4\u05B7\u05E6\u0
